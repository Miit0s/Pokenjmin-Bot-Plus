name: Docker Image CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set timestamp
      id: timestamp
      run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV

    - name: Copy and configure settings.json
      run: |
        cp settings_template.json settings.json
        sed -i 's/"Token": ".*"/"Token": "${{ secrets.DISCORD_BOT_TOKEN }}"/' settings.json

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/pordrack/pokenjmin-bot/pokenjmin-bot:${{ env.TIMESTAMP }}

    - name: Push the Docker image
      run: docker push ghcr.io/pordrack/pokenjmin-bot/pokenjmin-bot:${{ env.TIMESTAMP }}
